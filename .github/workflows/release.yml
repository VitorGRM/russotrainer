# Compila o RussoTrainer para Windows e publica o release que o atualizador do app consulta.
# Dispara quando uma tag de versão (v1.6.1, v1.7.0...) é enviada ao GitHub,
# normalmente pelo publicar_alteracoes.bat. Também pode ser disparado à mão na aba Actions.
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (ex.: v1.6.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Conferir se a tag bate com APP_VERSION
        shell: pwsh
        run: |
          $version = (Select-String -Path app.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "A tag $env:TAG não corresponde a APP_VERSION = $version no app.py." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validar o conteúdo dos exercícios
        run: python tools/validate_content.py

      - name: Compilar com PyInstaller
        run: python -m PyInstaller packaging/RussoTrainer.spec --noconfirm --distpath dist --workpath build

      - name: Compactar
        shell: pwsh
        run: |
          $zip = "dist/RussoTrainer-v$env:VERSION-windows.zip"
          Compress-Archive -Path dist/RussoTrainer/* -DestinationPath $zip -CompressionLevel Optimal
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("{0} ({1:N0} MB)" -f $zip, ((Get-Item $zip).Length / 1MB))

      - name: Publicar o release
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            # A mensagem da tag (o que foi digitado no .bat) vira a descrição do release.
            gh release create $env:TAG $env:ZIP --title $env:TAG --notes-from-tag --latest
            if ($LASTEXITCODE -ne 0) {
              gh release create $env:TAG $env:ZIP --title $env:TAG --generate-notes --latest
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o release." }
