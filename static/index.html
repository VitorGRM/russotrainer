<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinguaLab · Русский</title>
  <script>
    try {
      const saved = localStorage.getItem("lingualab-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (_) { /* armazenamento bloqueado: segue o sistema */ }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="home-button" type="button" aria-label="Voltar aos temas">
      <span class="brand-mark" aria-hidden="true">Я</span>
      <span class="brand-name">LinguaLab <span class="ru">Русский</span></span>
    </button>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Procurar palavra em russo ou português" autocomplete="off" aria-label="Procurar palavra">
      <div class="search-results" id="search-results" hidden></div>
    </form>
    <div class="topbar-stats" id="topbar-stats" aria-live="polite"></div>
    <button class="icon-button" id="settings-button" type="button" aria-haspopup="dialog" aria-label="Preferências">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <div class="update-banner" id="update-banner" hidden></div>

  <main id="view-gallery" class="gallery-view">
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">Escolha um tema</h1>
      <p id="intro-text">Cada ficha reúne verbos, substantivos, adjetivos, estruturas e expressões de um campo da vida. Abra uma ficha para ver seu progresso e começar.</p>
    </section>
    <div class="catalog" id="catalog" role="list"></div>
    <p class="sources" id="sources"></p>
  </main>

  <main id="view-session" class="session-view" hidden>
    <div class="session-bar">
      <button class="text-button" id="session-close" type="button">Sair da sessão</button>
      <div class="session-title" id="session-title"></div>
      <div class="session-progress" aria-hidden="true"><span id="session-progress-bar"></span></div>
      <div class="session-count" id="session-count"></div>
    </div>
    <div class="stage" id="stage" aria-live="polite"></div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-close aria-label="Fechar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="popover" id="dict-popover" hidden role="dialog" aria-label="Dicionário"></div>

  <script src="app.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
